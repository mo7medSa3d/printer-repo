<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
<!--
  Print Gateway — product mark
  Calm, premium, enterprise. Brand blue tile (#2563EB → #1D4ED8, an
  intentionally near-flat gradient), white device geometry, cool-neutral
  paper. No neon, no glow, no multi-hue accents.
-->
<defs>
  <linearGradient id="tile" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#2563EB"/>
    <stop offset="100%" stop-color="#1D4ED8"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- Brand tile -->
<rect width="1024" height="1024" rx="232" fill="url(#tile)"/>
<rect width="1024" height="620" rx="232" fill="url(#sheen)"/>

<!-- Quiet geometric depth: two very low-opacity rings -->
<g fill="none" stroke="#FFFFFF" stroke-opacity="0.10">
  <circle cx="836" cy="196" r="150" stroke-width="26"/>
  <circle cx="188" cy="880" r="118" stroke-width="20"/>
</g>

<!-- Document entering the device -->
<rect x="336" y="236" width="352" height="248" rx="24" fill="#FFFFFF"/>
<rect x="384" y="296" width="256" height="18" rx="9" fill="#93C5FD"/>
<rect x="384" y="340" width="256" height="18" rx="9" fill="#DBEAFE"/>
<rect x="384" y="384" width="176" height="18" rx="9" fill="#DBEAFE"/>

<!-- Device body -->
<rect x="232" y="456" width="560" height="300" rx="48" fill="#FFFFFF"/>
<!-- Intake slot -->
<rect x="304" y="424" width="416" height="64" rx="24" fill="#0F172A"/>
<rect x="328" y="444" width="368" height="10" rx="5" fill="#334155"/>

<!-- Control face -->
<rect x="288" y="516" width="448" height="112" rx="28" fill="#0F172A"/>
<rect x="320" y="548" width="200" height="48" rx="14" fill="#1D4ED8"/>
<rect x="340" y="564" width="72" height="10" rx="5" fill="#DBEAFE"/>
<rect x="340" y="582" width="120" height="8" rx="4" fill="#93C5FD" fill-opacity="0.75"/>
<circle cx="600" cy="572" r="18" fill="#1E293B"/>
<circle cx="656" cy="572" r="18" fill="#1E293B"/>
<circle cx="712" cy="572" r="18" fill="#60A5FA"/>

<!-- Output -->
<rect x="376" y="676" width="272" height="30" rx="12" fill="#0F172A" fill-opacity="0.9"/>
<rect x="356" y="706" width="312" height="118" rx="22" fill="#FFFFFF"/>
<rect x="400" y="742" width="224" height="14" rx="7" fill="#E2E8F0"/>
<rect x="400" y="774" width="160" height="14" rx="7" fill="#E2E8F0"/>

<!-- Definition edge for light backgrounds -->
<rect x="3" y="3" width="1018" height="1018" rx="230" fill="none" stroke="#0F172A" stroke-opacity="0.08" stroke-width="6"/>
</svg>
