<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <!-- The Desktop Manager is a light-surface product on every Windows theme. -->
    <meta name="color-scheme" content="light"/>
    <!-- Brand primary — keeps the OS/WebView chrome on-brand -->
    <meta name="theme-color" content="#2563EB"/>
    <title>Odoo Print Manager</title>
    <style>
      /* Paint the light canvas before the bundle loads (no dark flash). */
      html, body { margin: 0; background-color: #f8fafc; color: #0f172a; }
    </style>
  </head>
  <body><div id="root"></div><script type="module" src="./main.tsx"></script></body>
</html>
