services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # The schema uses timestamp-without-time-zone and the gateway compares
      # SQL now() against app-written timestamps: the whole deployment must
      # run in UTC (see docs/DEPLOYMENT.md, Timezone requirement).
      TZ: UTC
      POSTGRES_DB: ${POSTGRES_DB:-odoo_print}
      POSTGRES_USER: ${POSTGRES_USER:-odoo_print}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - printer_backend

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: UTC
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-odoo_print}
      PGUSER: ${POSTGRES_USER:-odoo_print}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    command: ["npm", "run", "db:migrate"]
    networks:
      - printer_backend

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      TZ: UTC
      HOSTNAME: 0.0.0.0
      PORT: 3000
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-odoo_print}
      PGUSER: ${POSTGRES_USER:-odoo_print}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET:?GATEWAY_JWT_SECRET must be set in .env}
      MANAGER_USERNAME: ${MANAGER_USERNAME:-admin}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD:-}
      MANAGER_PASSWORD_HASH: ${MANAGER_PASSWORD_HASH:-}
      ALLOW_PLAINTEXT_MANAGER_PASSWORD: ${ALLOW_PLAINTEXT_MANAGER_PASSWORD:-}
      STALE_AGENT_THRESHOLD_SECONDS: ${STALE_AGENT_THRESHOLD_SECONDS:-90}
      # Required for per-IP rate limiting behind the bundled Caddy. Safe ONLY
      # because the caddy service overwrites X-Forwarded-For with the real
      # client address (see Caddyfile) — never set TRUST_PROXY=1 when the
      # gateway is reachable directly from untrusted networks.
      TRUST_PROXY: ${TRUST_PROXY:-1}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - printer_backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:?GATEWAY_DOMAIN must be set to a DNS name for production TLS}
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - printer_backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  printer_backend:
    driver: bridge
