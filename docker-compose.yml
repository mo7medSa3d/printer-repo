services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odoo_print}
      POSTGRES_USER: ${POSTGRES_USER:-odoo_print}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - printer_backend

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-odoo_print}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-odoo_print}
    command: ["npm", "run", "db:migrate"]
    networks:
      - printer_backend

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-odoo_print}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-odoo_print}
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET:?GATEWAY_JWT_SECRET must be set in .env}
      MANAGER_USERNAME: ${MANAGER_USERNAME:-admin}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD:-}
      MANAGER_PASSWORD_HASH: ${MANAGER_PASSWORD_HASH:-}
      ALLOW_PLAINTEXT_MANAGER_PASSWORD: ${ALLOW_PLAINTEXT_MANAGER_PASSWORD:-}
      STALE_AGENT_THRESHOLD_SECONDS: ${STALE_AGENT_THRESHOLD_SECONDS:-90}
      TRUST_PROXY: ${TRUST_PROXY:-}
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - printer_backend

volumes:
  postgres_data:

networks:
  printer_backend:
    driver: bridge
