services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: UTC
      POSTGRES_DB: ${POSTGRES_DB:-odoo_print}
      POSTGRES_USER: ${POSTGRES_USER:-odoo_print}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - printer_backend

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: UTC
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-odoo_print}
      PGUSER: ${POSTGRES_USER:-odoo_print}
      PGPASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    command: ["npm", "run", "db:migrate"]
    networks:
      - printer_backend

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      TZ: UTC
      HOSTNAME: 0.0.0.0
      PORT: 3000
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-odoo_print}
      PGUSER: ${POSTGRES_USER:-odoo_print}
      PGPASSWORD_FILE: /run/secrets/postgres_password
      GATEWAY_JWT_SECRET_FILE: /run/secrets/gateway_jwt_secret
      MANAGER_USERNAME: ${MANAGER_USERNAME:-admin}
      MANAGER_PASSWORD_HASH_FILE: /run/secrets/manager_password_hash
      ALLOW_PLAINTEXT_MANAGER_PASSWORD:
      ODOO_DATABASE_NAME: ${ODOO_DATABASE_NAME:?ODOO_DATABASE_NAME must be set to the exact Odoo database name}
      STALE_AGENT_THRESHOLD_SECONDS: ${STALE_AGENT_THRESHOLD_SECONDS:-90}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      TRUST_PROXY_SECRET_FILE: /run/secrets/trust_proxy_secret
    secrets:
      - postgres_password
      - gateway_jwt_secret
      - manager_password_hash
      - trust_proxy_secret
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - printer_backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:?GATEWAY_DOMAIN must be set to a DNS name for production TLS}
      TRUST_PROXY_SECRET: ${TRUST_PROXY_SECRET:?TRUST_PROXY_SECRET must be set when TRUST_PROXY=1}
    secrets:
      - trust_proxy_secret
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - printer_backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

secrets:
  postgres_password:
    environment: POSTGRES_PASSWORD
  gateway_jwt_secret:
    environment: GATEWAY_JWT_SECRET
  manager_password_hash:
    environment: MANAGER_PASSWORD_HASH
  trust_proxy_secret:
    environment: TRUST_PROXY_SECRET

networks:
  printer_backend:
    driver: bridge
