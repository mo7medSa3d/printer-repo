name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Remove path aliases from PR branch
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_BRANCH" --depth=1
          git checkout "$HEAD_BRANCH"
          python3 <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          root = Path.cwd().resolve()
          prefix = chr(64) + "/"
          code_ext = {".ts", ".tsx", ".js", ".jsx", ".mts", ".cts", ".mjs", ".cjs"}
          skip_dirs = {".git", "node_modules", ".next", "dist", "build", "target", ".venv", "venv"}
          import_pattern = re.compile(r"(['\"])(?:" + re.escape(prefix) + r")([^'\"]+)\1")
          changed = []

          def relative_target(path: Path, suffix: str) -> str:
              target = root / "src" / suffix
              rel = os.path.relpath(target, path.parent).replace(os.sep, "/")
              return rel if rel.startswith(".") else "./" + rel

          for path in root.rglob("*"):
              if not path.is_file() or any(part in skip_dirs for part in path.parts):
                  continue
              try:
                  original = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              text = original
              if path.suffix in code_ext:
                  text = import_pattern.sub(lambda m: m.group(1) + relative_target(path, m.group(2)) + m.group(1), text)
              else:
                  text = text.replace(prefix, "src/")

              if path.name == "tsconfig.json":
                  data = json.loads(text)
                  options = data.get("compilerOptions", {})
                  options.pop("baseUrl", None)
                  options.pop("paths", None)
                  text = json.dumps(data, indent=2) + "\n"

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed.append(str(path.relative_to(root)))

          dockerfile = root / "Dockerfile"
          if dockerfile.exists():
              original = dockerfile.read_text(encoding="utf-8")
              lines = [line for line in original.splitlines() if "path aliases" not in line and "tsconfig.json" not in line]
              updated = "\n".join(lines).rstrip() + "\n"
              if updated != original:
                  dockerfile.write_text(updated, encoding="utf-8")
                  changed.append("Dockerfile")

          leftovers = []
          for path in root.rglob("*"):
              if not path.is_file() or any(part in skip_dirs for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if prefix in text:
                  leftovers.append(str(path.relative_to(root)))

          tsconfig = json.loads((root / "tsconfig.json").read_text(encoding="utf-8"))
          options = tsconfig.get("compilerOptions", {})
          if "paths" in options or "baseUrl" in options:
              leftovers.append("tsconfig.json (baseUrl/paths)")

          if leftovers:
              print("Forbidden path-alias references remain:")
              print("\n".join(leftovers))
              raise SystemExit(1)
          print(f"Relative-import codemod changed {len(changed)} files.")
          PY

          if git diff --quiet; then
            echo "No path-alias changes required."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "refactor: remove TypeScript path aliases"
            git push origin HEAD:"$HEAD_BRANCH"
          fi

      - name: Verify no path aliases
        shell: bash
        run: |
          set -euo pipefail
          pattern="$(printf '\x40/')"
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next --exclude='*.lock' --exclude='*.svg' --exclude='*.png' --exclude='*.ico' "$pattern" .; then
            echo "Path aliases are forbidden. Use relative imports."
            exit 1
          fi
          if grep -nE '"baseUrl"|"paths"' tsconfig.json; then
            echo "TypeScript path mapping is forbidden."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: agent/go.sum
      - name: Install dependencies
        run: npm ci
      - name: Audit production and development dependencies
        run: npm audit --audit-level=moderate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Validate Odoo 19 addon XML conventions
        run: |
          if grep -R -nE '<tree([[:space:]>])|attrs=|states=' odoo_addons/print_gateway/views; then
            echo 'Odoo 19 incompatibility detected: use <list> and direct modifiers instead of <tree>, attrs, or states.'
            exit 1
          fi
      - name: Run unit tests (no DB)
        run: npm run test:unit
      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 -U postgres && break
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432 -U postgres
      - name: Run Drizzle migrations
        run: npm run db:migrate
      - name: Verify schema invariants
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM information_schema.tables WHERE table_name='branches';"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/0009_runtime_invariant_guard.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT 'schema ok';"
      - name: Run integration tests (PostgreSQL)
        run: npm run test:integration
      - name: Run complete test suite
        run: npm test
      - name: Go vet
        working-directory: agent
        run: go vet ./...
      - name: Go tests
        working-directory: agent
        run: go test -count=1 -p 2 ./...
      - name: Go race tests
        working-directory: agent
        run: go test -count=1 -race -p 2 ./...
      - name: Build Next.js
        run: npm run build

  odoo19:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 -U odoo && break
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432 -U odoo
      - name: Create Odoo test database
        env:
          PGPASSWORD: odoo
        run: createdb -h 127.0.0.1 -U odoo odoo19_test
      - name: Install and test addon on Odoo 19 Community
        run: |
          docker pull odoo:19.0
          docker run --rm --network host \
            --add-host=db:127.0.0.1 \
            -v "$GITHUB_WORKSPACE/odoo_addons:/mnt/extra-addons:ro" \
            odoo:19.0 \
            odoo \
              --database=odoo19_test \
              --db_host=127.0.0.1 \
              --db_port=5432 \
              --db_user=odoo \
              --db_password=odoo \
              --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons \
              --without-demo=1 \
              --http-interface=127.0.0.1 \
              --init=print_gateway \
              --test-tags=/print_gateway \
              --stop-after-init \
              --log-level=test
