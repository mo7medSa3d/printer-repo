name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify relative imports only
        shell: bash
        run: |
          set -euo pipefail
          pattern="$(printf '\x40/')"
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next --exclude='*.lock' --exclude='*.svg' --exclude='*.png' --exclude='*.ico' "$pattern" .; then
            echo "Path aliases are forbidden. Use relative imports."
            exit 1
          fi
          if grep -nE '"baseUrl"|"paths"' tsconfig.json; then
            echo "TypeScript path mapping is forbidden."
            exit 1
          fi
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # Pinned to agent/go.mod so the CI toolchain can never drift from
          # the module's declared Go version.
          go-version-file: agent/go.mod
          cache: true
          cache-dependency-path: agent/go.sum
      - name: Install dependencies
        run: npm ci
      - name: Audit production and development dependencies
        run: npm audit --audit-level=moderate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Validate Odoo 19 addon XML conventions
        run: |
          if grep -R -nE '<tree([[:space:]>])|attrs=|states=' odoo_addons/print_gateway/views; then
            echo 'Odoo 19 incompatibility detected.'
            exit 1
          fi
      - name: Build Next.js
        run: npm run build
      - name: Run unit tests (no DB)
        run: npm run test:unit
      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 -U postgres -d app_db && break
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432 -U postgres -d app_db
      - name: Run Drizzle migrations
        run: npm run db:migrate
      - name: Verify final runtime-only schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            legacy_tables text[] := ARRAY['branches','destinations','document_types','local_networks','printer_bindings'];
            legacy_columns text[] := ARRAY['branch_id','destination_id','local_network_id'];
            table_name_value text;
            column_name_value text;
          BEGIN
            FOREACH table_name_value IN ARRAY legacy_tables LOOP
              IF to_regclass('public.' || table_name_value) IS NOT NULL THEN
                RAISE EXCEPTION 'legacy Gateway business table still exists: %', table_name_value;
              END IF;
            END LOOP;

            FOREACH column_name_value IN ARRAY legacy_columns LOOP
              IF EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_schema='public'
                  AND column_name=column_name_value
                  AND table_name IN ('agents','printers','print_jobs','api_keys','discovery_sessions','discovered_devices')
              ) THEN
                RAISE EXCEPTION 'legacy Gateway ownership column still exists: %', column_name_value;
              END IF;
            END LOOP;

            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
              WHERE schemaname='public' AND tablename='print_jobs'
                AND indexname='print_jobs_idempotency_unique'
            ) THEN
              RAISE EXCEPTION 'global print job idempotency index is missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='print_jobs' AND column_name='destination'
            ) THEN
              RAISE EXCEPTION 'print_jobs.destination is missing';
            END IF;

            -- Corrective migration 0026: column defaults must match the
            -- application contract (the 0001 defaults 'thermal'/'tcp' are
            -- forbidden by the 0006 CHECK constraints).
            IF EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='printers'
                AND column_name='printer_type'
                AND (column_default IS NULL OR column_default NOT LIKE '%physical%')
            ) THEN
              RAISE EXCEPTION 'printers.printer_type default does not match the application contract (physical)';
            END IF;
            IF EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='printers'
                AND column_name='connection_type'
                AND (column_default IS NULL OR column_default NOT LIKE '%network%')
            ) THEN
              RAISE EXCEPTION 'printers.connection_type default does not match the application contract (network)';
            END IF;
          END $$;
          SQL
      - name: Run integration tests (PostgreSQL)
        run: npm run test:integration
      - name: Verify production-like migration upgrade
        run: npm run test:integration -- --run tests/migration-upgrade.integration.test.ts
      - name: Verify multi-instance Gateway delivery
        env:
          RUN_MULTI_INSTANCE_TEST: '1'
        run: npm run test:integration -- --run tests/multi-instance-gateway.test.ts
      - name: Run complete test suite
        run: npm test
      - name: Go formatting gate
        working-directory: agent
        run: |
          test -z "$(gofmt -l .)" || { echo 'gofmt required on:'; gofmt -l .; exit 1; }
      - name: Go vet
        working-directory: agent
        run: go vet ./...
      - name: Go tests
        working-directory: agent
        run: go test -count=1 -p 2 ./...
      - name: Go race tests
        working-directory: agent
        run: go test -count=1 -race -p 2 ./...

  odoo19:
    runs-on: ubuntu-latest
    # A hung Odoo suite must fail loudly instead of burning the 6h default
    # timeout silently (module load + suite normally finish well within this).
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 -U odoo -d postgres && break
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432 -U odoo -d postgres
      - name: Create Odoo test database
        env:
          PGPASSWORD: odoo
        run: createdb -h 127.0.0.1 -U odoo odoo19_test
      - name: Install and test addon on Odoo 19 Community
        run: |
          docker pull odoo:19.0
          # The container's exit code alone is NOT sufficient evidence: a
          # regression that collects ZERO tests also exits 0. The log is
          # asserted below for the unittest summary line.
          docker run --rm --network host --name odoo19_test_run \
            --add-host=db:127.0.0.1 \
            -v "$GITHUB_WORKSPACE/odoo_addons:/mnt/extra-addons:ro" \
            odoo:19.0 \
            odoo \
              --database=odoo19_test \
              --db_host=127.0.0.1 \
              --db_port=5432 \
              --db_user=odoo \
              --db_password=odoo \
              --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons \
              --without-demo=true \
              --http-interface=127.0.0.1 \
              --init=print_gateway \
              --test-tags=/print_gateway \
              --stop-after-init \
              --log-level=test 2>&1 | tee /tmp/odoo19_test.log
      - name: Assert the Odoo addon tests actually ran and passed
        run: |
          set -euo pipefail
          # Odoo 19 reports its suite as two log lines (NOT unittest's
          # "Ran N tests" format):
          #   odoo.tests.stats:  print_gateway: 92 tests ...
          #   odoo.tests.result: 0 failed, 0 error(s) of 80 tests ...
          # A tag/import regression that collects ZERO tests still exits 0,
          # so both lines are asserted here. Missing lines or any nonzero
          # failure/error/skip count = vacuous or broken green.
          stats_line="$(grep -E 'odoo\.tests\.stats: +print_gateway: +[0-9]+ tests' /tmp/odoo19_test.log | tail -1 || true)"
          result_line="$(grep -E 'odoo\.tests\.result: ' /tmp/odoo19_test.log | tail -1 || true)"
          if [ -z "$stats_line" ] || [ -z "$result_line" ]; then
            echo 'ERROR: Odoo test summary lines missing - the suite did not run to completion.'
            tail -30 /tmp/odoo19_test.log || true
            exit 1
          fi
          echo "$stats_line"
          echo "$result_line"
          collected="$(echo "$stats_line" | grep -oE '[0-9]+ tests' | grep -oE '[0-9]+')"
          if [ "$collected" -lt 80 ]; then
            echo "ERROR: only $collected Odoo tests collected; expected the full print_gateway suite (>=80)."
            exit 1
          fi
          if ! grep -Eq 'odoo\.tests\.result: 0 failed, 0 error\(s\)' /tmp/odoo19_test.log; then
            echo 'ERROR: Odoo test suite reported failures or errors.'
            exit 1
          fi
          if grep -Eo 'odoo\.tests\.result:.*[1-9][0-9]* skipped' /tmp/odoo19_test.log; then
            echo 'ERROR: the Odoo suite skipped tests; required production tests must not silently disappear.'
            exit 1
          fi
