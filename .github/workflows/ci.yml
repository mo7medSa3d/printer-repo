name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: agent/go.sum
      - name: Install dependencies
        run: npm ci
      - name: Audit production and development dependencies
        run: npm audit --audit-level=moderate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Validate Odoo 19 addon XML conventions
        run: |
          if grep -R -nE '<tree([[:space:]>])|attrs=|states=' odoo_addons/print_gateway/views; then
            echo 'Odoo 19 incompatibility detected: use <list> and direct modifiers instead of <tree>, attrs, or states.'
            exit 1
          fi
      - name: Run unit tests (no DB)
        run: npm run test:unit
      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 -U postgres && break
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432 -U postgres
      - name: Run Drizzle migrations
        run: npm run db:migrate
      - name: Verify schema invariants
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM information_schema.tables WHERE table_name='branches';"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/0009_runtime_invariant_guard.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT 'schema ok';"
      - name: Run integration tests (PostgreSQL)
        run: npm run test:integration
      - name: Run complete test suite
        run: npm test
      - name: Go vet
        working-directory: agent
        run: go vet ./...
      - name: Go tests
        working-directory: agent
        run: go test -count=1 -p 2 ./...
      - name: Go race tests
        working-directory: agent
        run: go test -count=1 -race -p 2 ./...
      - name: Build Next.js
        run: npm run build

  odoo19:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 -U odoo && break
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432 -U odoo
      - name: Create Odoo test database
        env:
          PGPASSWORD: odoo
        run: createdb -h 127.0.0.1 -U odoo odoo19_test
      - name: Install and test addon on Odoo 19 Community
        run: |
          docker pull odoo:19.0
          docker run --rm --network host \
            --add-host=db:127.0.0.1 \
            -v "$GITHUB_WORKSPACE/odoo_addons:/mnt/extra-addons:ro" \
            odoo:19.0 \
            odoo \
              --database=odoo19_test \
              --db_host=127.0.0.1 \
              --db_port=5432 \
              --db_user=odoo \
              --db_password=odoo \
              --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons \
              --without-demo=1 \
              --http-interface=127.0.0.1 \
              --init=print_gateway \
              --test-tags=/print_gateway \
              --stop-after-init \
              --log-level=test
