name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
          cache-dependency-path: agent/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests (no DB)
        run: npm run test:unit

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 -U postgres && break
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432 -U postgres

      - name: Run Drizzle migrations
        run: npm run db:migrate

      - name: Verify schema invariants
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM information_schema.tables WHERE table_name='branches';"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/0009_runtime_invariant_guard.sql || true
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT 'schema ok';"

      - name: Run integration tests (PostgreSQL)
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db

      - name: Run all tests with coverage gate
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db

      - name: Go vet
        working-directory: agent
        run: go vet ./...

      - name: Go tests
        working-directory: agent
        run: go test -count=1 -p 2 ./...

      - name: Go race tests
        working-directory: agent
        run: go test -count=1 -race -p 2 ./...

      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
