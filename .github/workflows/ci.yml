name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node lint / typecheck / tests / build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: print_gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d print_gateway_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/print_gateway_test
      NODE_ENV: test
      MANAGER_USERNAME: ci-manager
      MANAGER_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run PostgreSQL migrations
        run: npm run db:migrate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build

  go:
    name: Go test / vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache: true
          cache-dependency-path: agent/go.sum
      - run: go test ./...
      - run: go vet ./...

  architecture:
    name: Architecture guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reject obsolete workflow location
        run: |
          test ! -d ci/workflows
          test -f .github/workflows/ci.yml
      - name: Reject authoritative printer branch ownership in Gateway
        run: |
          if grep -nE 'branchId:.*branch_id.*' src/db/schema.ts | grep -E 'printers|printer'; then
            echo 'Gateway printer schema contains an independent branch ownership field' >&2
            exit 1
          fi
          if grep -RInE 'printer\.(branchId|branch_id)|printers\.branch_id' src --exclude-dir=node_modules --exclude='*.md'; then
            echo 'Gateway source contains obsolete authoritative printer branch ownership' >&2
            exit 1
          fi
      - name: Check migration files are tracked inputs
        run: |
          test -f drizzle/0006_architecture_hardening.sql
          test -f drizzle/0007_auth_rate_limit_retention.sql
          test -f odoo_addons/print_gateway/migrations/1.1.0/pre-migrate.py
