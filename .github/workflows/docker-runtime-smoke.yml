name: Docker Runtime Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose config
        env:
          POSTGRES_PASSWORD: ci-only-password
          GATEWAY_JWT_SECRET: ci-only-jwt-secret-012345678901234567890123456789

      - name: Start stack
        run: docker compose up -d --build
        env:
          POSTGRES_PASSWORD: ci-only-password
          GATEWAY_JWT_SECRET: ci-only-jwt-secret-012345678901234567890123456789

      - name: Verify migration and gateway health
        shell: bash
        env:
          POSTGRES_PASSWORD: ci-only-password
          GATEWAY_JWT_SECRET: ci-only-jwt-secret-012345678901234567890123456789
        run: |
          set -euo pipefail
          docker compose ps migrate
          docker compose ps migrate | grep -q 'Exited (0)'

          healthy=0
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3000/api/health >/tmp/gateway-health.json; then
              healthy=1
              break
            fi
            sleep 2
          done

          docker compose ps
          if [ "$healthy" -ne 1 ]; then
            echo "Gateway did not become healthy within 120 seconds" >&2
            exit 1
          fi
          cat /tmp/gateway-health.json

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
        env:
          POSTGRES_PASSWORD: ci-only-password
          GATEWAY_JWT_SECRET: ci-only-jwt-secret-012345678901234567890123456789

      - name: Tear down
        if: always()
        run: docker compose down -v
        env:
          POSTGRES_PASSWORD: ci-only-password
          GATEWAY_JWT_SECRET: ci-only-jwt-secret-012345678901234567890123456789
