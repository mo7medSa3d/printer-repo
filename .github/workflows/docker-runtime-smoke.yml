name: Docker Runtime Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose config
        env:
          POSTGRES_PASSWORD: ci-only-password
          GATEWAY_JWT_SECRET: ci-only-jwt-secret-012345678901234567890123456789

      - name: Start stack
        run: docker compose up -d --build
        env:
          POSTGRES_PASSWORD: ci-only-password
          GATEWAY_JWT_SECRET: ci-only-jwt-secret-012345678901234567890123456789

      - name: Verify migration and gateway health
        shell: bash
        env:
          POSTGRES_PASSWORD: ci-only-password
          GATEWAY_JWT_SECRET: ci-only-jwt-secret-012345678901234567890123456789
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if docker compose ps --status running gateway | grep -q gateway; then
              break
            fi
            sleep 2
          done
          docker compose ps
          docker compose ps migrate | grep -q 'Exited (0)'
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
        env:
          POSTGRES_PASSWORD: ci-only-password
          GATEWAY_JWT_SECRET: ci-only-jwt-secret-012345678901234567890123456789

      - name: Tear down
        if: always()
        run: docker compose down -v
