name: Main Branch Governance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Run security audit
        run: npm audit --audit-level=moderate
  verify-main-protection:
    runs-on: ubuntu-latest
    steps:
      - name: Require protected main branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          protected=$(gh api "repos/${REPOSITORY}/branches/main" --jq '.protected')
          if [[ "$protected" != "true" ]]; then
            echo "ERROR: main branch is not protected. Configure GitHub branch protection or a ruleset with required status checks before merging production changes."
            exit 1
          fi
          echo "main branch protection is enabled."
          # Protection WITHOUT required checks is vacuous: every other
          # workflow would be advisory. Assert the required gatework is
          # actually listed (classic protection exposes contexts; rulesets
          # expose required status check rules).
          required=$(gh api "repos/${REPOSITORY}/branches/main" --jq '.required_status_checks.contexts | join(",")' 2>/dev/null || echo "")
          if [ -z "$required" ]; then
            required=$(gh api "repos/${REPOSITORY}/rules/branches/main" --jq '[.[] | ((.parameters.required_status_checks // []) | if type == "array" then [.[].context] else [] end)] | flatten | join(",")' 2>/dev/null || echo "")
          fi
          echo "required checks: ${required:-<none>}"
          missing=""
          for expected in ci odoo19; do
            if ! grep -qw "$expected" <<< "$required"; then
              echo "::warning::Required status check '$expected' is not configured on main - merge gating is currently advisory only. A repository admin must add 'ci' and 'odoo19' to the branch protection required checks; this workflow cannot configure repository settings by itself."
              missing="$missing $expected"
            fi
          done
          if [ -n "$missing" ]; then
            echo "ACTION REQUIRED (repository settings, not code): configure required status checks [${missing} ] on main. Proceeding without failing this run because the setting is outside any PR's control - see the warnings above."
          else
            echo "required checks for ci and odoo19 are configured."
          fi
