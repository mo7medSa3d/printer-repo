name: Remove Path Aliases

on:
  push:
    branches: [fix/production-hardening]

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rewrite imports to relative paths
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import os, re, json

          root = Path.cwd().resolve()
          prefix = chr(64) + "/"
          code_ext = {".ts", ".tsx", ".js", ".jsx", ".mts", ".cts", ".mjs", ".cjs"}
          skip_dirs = {".git", "node_modules", ".next", "dist", "build", "target", ".venv", "venv"}
          touched = 0

          def rel_import(file_path: Path, suffix: str) -> str:
              target = root / "src" / suffix
              rel = os.path.relpath(target, file_path.parent).replace(os.sep, "/")
              return rel if rel.startswith(".") else "./" + rel

          def rewrite_code(text: str, path: Path) -> str:
              pattern = re.compile(r"(['\"])" + re.escape(prefix) + r"([^'\"]+)\1")
              return pattern.sub(lambda m: m.group(1) + rel_import(path, m.group(2)) + m.group(1), text)

          for path in root.rglob("*"):
              if not path.is_file() or any(part in skip_dirs for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              new = rewrite_code(text, path) if path.suffix in code_ext else text.replace(prefix, "src/")
              if path.name == "tsconfig.json":
                  try:
                      data = json.loads(new)
                      opts = data.get("compilerOptions", {})
                      opts.pop("baseUrl", None)
                      opts.pop("paths", None)
                      path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
                      new = path.read_text(encoding="utf-8")
                  except json.JSONDecodeError:
                      pass
              if new != text:
                  path.write_text(new, encoding="utf-8")
                  touched += 1

          leftovers = []
          for path in root.rglob("*"):
              if not path.is_file() or any(part in skip_dirs for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if prefix in text or path.name == "tsconfig.json" and ('"paths"' in text or '"baseUrl"' in text):
                  leftovers.append(str(path.relative_to(root)))

          if leftovers:
              print("Forbidden path-alias references remain:")
              print("\n".join(leftovers))
              raise SystemExit(1)
          print(f"Updated {touched} files; no path aliases remain.")
          PY

      - name: Commit rewritten imports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          rm -f .github/workflows/remove-path-aliases.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "refactor: remove TypeScript path aliases"
          git push origin HEAD:fix/production-hardening
