name: Finish production hardening

on:
  push:
    branches:
      - fix/full-production-hardening-2026-09
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: fix/full-production-hardening-2026-09
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: agent/go.sum
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Apply final hardening patch
        run: python3 scripts/finish-production-hardening.py
      - name: Format changed Go files
        working-directory: agent
        run: gofmt -w internal/agent/agent.go internal/agent/discovery_manager.go internal/config/config.go
      - name: Verify lockfile and Go syntax
        working-directory: agent
        run: go test -run '^$' ./...
      - name: Commit hardening changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/finish-production-hardening.py .github/workflows/finish-production-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: complete production hardening pass"
          git push origin HEAD:fix/full-production-hardening-2026-09
