name: Apply production hardening

on:
  push:
    branches:
      - fix/full-production-hardening-2026-09

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: agent/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Apply hardening transformations
        run: python3 scripts/apply-production-hardening.py

      - name: Format Go sources
        working-directory: agent
        run: gofmt -w internal/agent/agent.go internal/agent/discovery_manager.go internal/agent/pairing.go internal/config/config.go

      - name: Validate Python syntax
        run: python3 -m py_compile odoo_addons/print_gateway/models/print_job.py

      - name: Verify generated lockfile
        run: test -s src-tauri/Cargo.lock

      - name: Commit hardening changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-production-hardening.py .github/workflows/apply-production-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hardening changes to commit"
            exit 0
          fi
          git commit -m "fix: complete production hardening pass"
          git push
