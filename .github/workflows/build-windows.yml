name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: agent/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust and Tauri
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri.exe
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-rust-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Install Tauri CLI
        shell: pwsh
        run: |
          $tauri = Get-Command cargo-tauri -ErrorAction SilentlyContinue
          if ($tauri) {
            cargo tauri --version
            Write-Host "Tauri CLI restored from cache; skipping install."
          } else {
            Write-Host "Tauri CLI not found in cache; installing..."
            cargo install tauri-cli --version "^2" --locked
          }

      - name: Install dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Run Vitest suite
        run: npm run test

      - name: Go vet
        working-directory: agent
        shell: pwsh
        run: go vet ./...

      - name: Go tests
        working-directory: agent
        shell: pwsh
        run: go test -count=1 -p 2 ./...

      - name: Go race tests
        working-directory: agent
        shell: pwsh
        run: go test -count=1 -race -p 2 ./...

      - name: Build Go Agent
        working-directory: agent
        shell: pwsh
        run: |
          go build -trimpath -ldflags="-s -w" -o OdooPrintAgent.exe ./cmd/agent
          go build -trimpath -ldflags="-s -w" -o odoo-agent-cli.exe ./cmd/cli

      - name: Verify Go binaries
        shell: pwsh
        run: |
          $agent = "agent\OdooPrintAgent.exe"
          $cli = "agent\odoo-agent-cli.exe"
          if (-not (Test-Path $agent)) { throw "Missing OdooPrintAgent.exe" }
          if (-not (Test-Path $cli)) { throw "Missing odoo-agent-cli.exe" }
          Get-Item $agent | Select-Object FullName, Length
          Get-Item $cli | Select-Object FullName, Length

      - name: Verify Tauri icon assets
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $icons = @($conf.bundle.icon)
          if ($icons.Count -eq 0) { throw "No bundle.icon entries in src-tauri/tauri.conf.json" }
          foreach ($icon in $icons) {
            $p = Join-Path "src-tauri" ($icon -replace '/', '\')
            if (-not (Test-Path $p)) { throw "Missing configured icon: $p" }
            $len = (Get-Item $p).Length
            if ($len -le 0) { throw "Empty configured icon: $p" }
            Write-Host "OK icon $icon ($len bytes)"
          }
          Write-Host "All $($icons.Count) configured icons are present."

      - name: Build desktop frontend
        run: npm run desktop:vite:build

      - name: Build Tauri Windows installer (MSI + NSIS EXE)
        shell: pwsh
        run: |
          cargo tauri build `
            --target x86_64-pc-windows-msvc `
            --bundles nsis,msi

      - name: Verify installer artifacts exist
        shell: pwsh
        run: |
          $msi = Get-ChildItem "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\msi\*.msi" -ErrorAction SilentlyContinue
          $exe = Get-ChildItem "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis\*.exe" -ErrorAction SilentlyContinue
          if (-not $msi) { throw "MSI bundle missing" }
          if (-not $exe) { throw "NSIS EXE bundle missing" }
          Write-Host "MSI:"
          $msi | Select-Object FullName, Length
          Write-Host "NSIS EXE:"
          $exe | Select-Object FullName, Length

      - name: Sign Windows release artifacts (required on main)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64)) {
            throw "WINDOWS_SIGNING_CERT_BASE64 is not configured; refusing to publish unsigned Windows artifacts."
          }
          $certPath = Join-Path $env:RUNNER_TEMP "windows-signing-cert.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))
          $signtool = Get-Command signtool.exe -ErrorAction Stop
          $timestamp = "http://timestamp.digicert.com"

          $binaries = Get-ChildItem "src-tauri\target\x86_64-pc-windows-msvc\release\bundle" -Recurse -File |
            Where-Object { $_.Extension -in @('.exe', '.msi') }
          if (-not $binaries) { throw "No Windows release binaries found to sign." }

          foreach ($artifact in $binaries) {
            Write-Host "Signing $($artifact.FullName)"
            & $signtool.Source sign /fd SHA256 /f $certPath /p $env:WINDOWS_SIGNING_CERT_PASSWORD /tr $timestamp /td SHA256 $artifact.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($artifact.FullName)" }
            & $signtool.Source verify /pa /all $artifact.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $($artifact.FullName)" }
          }
          Remove-Item -Force $certPath

      - name: Install MSI and smoke-test installed app
        shell: pwsh
        run: |
          $msi = Get-ChildItem "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\msi\*.msi" | Select-Object -First 1
          if (-not $msi) { throw "MSI bundle missing" }
          $msiLog = Join-Path $env:RUNNER_TEMP "odoo-msi-install.log"
          $proc = Start-Process msiexec -ArgumentList @(
            "/i", "`"$($msi.FullName)`"", "/qn", "/norestart", "/l*v", "`"$msiLog`""
          ) -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Get-Content $msiLog -Tail 200
            throw "MSI install failed with code $($proc.ExitCode)"
          }
          $installDir = Join-Path $env:ProgramFiles "Odoo Print Manager"
          $installedExe = Join-Path $installDir "odoo-print-manager.exe"
          if (-not (Test-Path $installedExe)) { throw "Installed EXE missing after MSI install: $installDir" }
          & pwsh -NoProfile -File .\scripts\smoke-test-windows.ps1 -InstallDir $installDir
          if ($LASTEXITCODE -ne 0) { throw "Windows smoke test failed" }

      - name: Verify production artifacts are signed
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem "src-tauri\target\x86_64-pc-windows-msvc\release\bundle" -Recurse -File |
            Where-Object { $_.Extension -in @('.exe', '.msi') }
          foreach ($artifact in $artifacts) {
            & signtool.exe verify /pa /all $artifact.FullName
            if ($LASTEXITCODE -ne 0) { throw "Unsigned or invalid Authenticode signature: $($artifact.FullName)" }
          }

      - name: Upload Windows MSI and NSIS EXE
        uses: actions/upload-artifact@v6
        with:
          name: Odoo-Print-Manager-Windows
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          compression-level: 9
