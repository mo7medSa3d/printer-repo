name: Docker Build

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'Caddyfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'server.ts'
      - 'src/**'
      - 'drizzle/**'
      - 'scripts/**'
      - 'next.config.ts'
      - 'tsconfig.json'

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build gateway image
        run: docker build --pull -t odoo-print-gateway:ci .

      - name: Validate Compose configuration
        run: docker compose config
        env:
          POSTGRES_PASSWORD: ci-only-password
          GATEWAY_JWT_SECRET: ci-only-jwt-secret-012345678901234567890123456789
          GATEWAY_DOMAIN: print.example.com
